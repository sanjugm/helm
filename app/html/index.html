<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx WebApp - Helm + ArgoCD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; opacity: 0.85; }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            margin: 6px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nginx WebApp</h1>
        <p>Deployed with Helm Charts + Argo CD</p>
        <div>
            <span class="badge">Kubernetes</span>
            <span class="badge">Helm v3</span>
            <span class="badge">Argo CD</span>
            <span class="badge">GitOps</span>
        </div>
    </div>
</body>
</html>
